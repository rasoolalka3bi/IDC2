name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # يفك مفتاح التوقيع الثابت إن أُضيف السر IDC_SIGNING_KEY في إعدادات المستودع.
      - name: Prepare signing key
        env:
          IDC_SIGNING_KEY: ${{ secrets.IDC_SIGNING_KEY }}
        run: |
          if [ -n "$IDC_SIGNING_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in android/app/release.jks.enc -out android/app/release.jks -pass env:IDC_SIGNING_KEY
            echo "Signing with the fixed release key"
          else
            echo "::warning::IDC_SIGNING_KEY is not set; the APK is signed with a temporary key"
          fi
      - run: flutter build apk --release --split-per-abi
        env:
          IDC_SIGNING_KEY: ${{ secrets.IDC_SIGNING_KEY }}
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk IDC-arm64.apk
          mv app-armeabi-v7a-release.apk IDC-old-phones.apk
          mv app-x86_64-release.apk IDC-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: idc-apk
          path: build/app/outputs/flutter-apk/IDC-*.apk
      # كل بناء يُنشر كإصدار في صفحة Releases حتى يمكن تنزيل الملف من الهاتف مباشرة.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IDC (بناء ${{ github.run_number }})
          body: |
            لمعظم الهواتف حمّل IDC-arm64.apk، وللهواتف القديمة IDC-old-phones.apk.
          files: build/app/outputs/flutter-apk/IDC-*.apk
          make_latest: true
